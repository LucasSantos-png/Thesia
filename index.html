<!DOCTYPE html>
<html>

  <head>
    <base target="_top">

    <style>
      body 
      {
        background-color: #2b2b2b;
        color: #f2f2f2
      }
    </style>

  </head>

  <body>
    <h1>Thesia</h1>

    <!--Inputs de dados-->
    <label>Avaliador: </label>
    <input type="text" id="avaliador">
    <br>

    <label>Título do TCC: </label>
    <input type="text" id="titulo">
    <br>


    <label>Aluno 1: </label>
    <input type="text" id="aluno1" oninput="atualizarNomeAluno(1)">
    <br>

    <label>Aluno 2: </label>
    <input type="text" id="aluno2" oninput="atualizarNomeAluno(2)">
    <br>

    <label>Aluno 3: </label>
    <input type="text" id="aluno3" oninput="atualizarNomeAluno(3)">
    <br>

    <label>Aluno 4: </label>
    <input type="text" id="aluno4" oninput="atualizarNomeAluno(4)">


    <h2>Artigo Científico</h2>

    <label>1. Adequação do tema com as linhas de pesquisa: <br> Máximo: 1,0 </label>
    <input type="text" id="artigo1" inputmode="decimal" placeholder="Ex: 0,5">
    <br>

    <label>2. Aplicação dos conceitos e teorias adquiridas durante o curso 
      de forma integrada: <br> Máximo: 1,0 </label>
    <input type="text" id="artigo2" inputmode="decimal" placeholder="Ex: 0,5">
    <br>

    <label>3. Contribuição dos resultados obtidos e estudos futuros sugeridos 
      para resolução de problemas dentro da área de formação: <br> Máximo: 2,0 </label>
    <input type="text" id="artigo3" inputmode="decimal" placeholder="Ex: 1,5">
    <br>

    <label>4. Rigor metodológico e sua relação com a análise de resultados: <br> Máximo: 2,0 </label>
    <input type="text" id="artigo4" inputmode="decimal" placeholder="Ex: 1,5">
    <br>

    <label>5. Atendimento a normalização ABNT e ao template da Faculdade: <br> Máximo: 2,0 </label>
    <input type="text" id="artigo5" inputmode="decimal" placeholder="Ex: 1,5">
    <br>

    <label>6. Clareza, contextualização, suficiência da quantidade da informação e adequação 
      da linguagem: <br> Máximo: 1,0 </label>
    <input type="text" id="artigo6" inputmode="decimal" placeholder="Ex: 0,5">
    <br>

    <label>7. Qualidade e originalidade dos argumentos: <br> Máximo: 1,0 </label>
    <input type="text" id="artigo7" inputmode="decimal" placeholder="Ex: 0,5">
    <br>


    <h2>Relatório Técnico</h2>

    <label>Relatório Técnico: </label>
    <input type="text" id="notaRelatorio" inputmode="decimal" placeholder="Ex: 8,5">


    <h2>Nota oral: </h2>

    <!--labels mudam o nome conforme são digitados-->
    <label> Aluno 1 <span id="nomeAluno1"></span>: </label>
    <input type="text" id="oral1" inputmode="decimal">
    <br>

    <label> Aluno 2 <span id="nomeAluno2"></span>: </label>
    <input type="text" id="oral2" inputmode="decimal">
    <br>

    <label> Aluno 3 <span id="nomeAluno3"></span>: </label>
    <input type="text" id="oral3" inputmode="decimal">
    <br>

    <label> Aluno 4 <span id="nomeAluno4"></span>: </label>
    <input type="text" id="oral4" inputmode="decimal">
    <br>

    
    <button onclick="calcular()">Calcular</button>

    <button onclick="salvarAvaliacao()">Salvar avaliação</button>

    <p id="mensagem"></p>



    <h2>Resultado</h2>

    <p id="resultado1"></p>
    <p id="resultado2"></p>
    <p id="resultado3"></p>
    <p id="resultado4"></p>


    <script>
      //função que converte de texto para número e verifica se o valor é válido
      function converterNota(valor, notaMaxima) 
      {
        //remove espaços - "/\s+/g" pega os espaços e os remove (troca por '')
        valor = valor.replace(/\s+/g,'');

        //aceita tanto 8,5 quanto 8.5 - troca virgula por ponto
        valor = valor.replace(',','.');

        //converte texto em número
        const nota = parseFloat(valor);

        //verifica se está vazio
        if (isNaN(nota)) 
        {
          return null;
        }

        //verifica se é um numero valido - >=0 ou <=nota máxima
        if (nota < 0 || nota > notaMaxima) 
        {
          return null;
        }

        return nota;

      }


      function pegarDados() 
      {
        //cria o objeto DADOS que recebe todas informações em um único lugar
        const dados = 
        {
          avaliador: document.getElementById("avaliador").value.trim(),

          titulo: document.getElementById("titulo").value.trim(),

          //joga as notas na função de converter nota - 
          //dados recebidos aqui (valor da nota, nota máxima permitida)
          artigo1: converterNota(document.getElementById("artigo1").value, 1),

          artigo2: converterNota(document.getElementById("artigo2").value, 1),

          artigo3: converterNota(document.getElementById("artigo3").value, 2),

          artigo4: converterNota(document.getElementById("artigo4").value, 2),

          artigo5: converterNota(document.getElementById("artigo5").value, 2),

          artigo6: converterNota(document.getElementById("artigo6").value, 1),

          artigo7: converterNota(document.getElementById("artigo7").value, 1),

          relatorio: converterNota(document.getElementById("notaRelatorio").value, 10),

          aluno1: document.getElementById("aluno1").value.trim(),

          oral1: converterNota(document.getElementById("oral1").value, 10),

          aluno2: document.getElementById("aluno2").value.trim(),

          oral2: converterNota(document.getElementById("oral2").value, 10),

          aluno3: document.getElementById("aluno3").value.trim(),

          oral3: converterNota(document.getElementById("oral3").value, 10),

          aluno4: document.getElementById("aluno4").value.trim(),

          oral4: converterNota(document.getElementById("oral4").value, 10)
        };

        return dados;
      }

      function validarDados(dados) 
      {
        if (
          dados.avaliador === "" || 
          dados.titulo === "" || 

          dados.aluno1 === "" || 
          dados.aluno2 === "" || 
          dados.aluno3 === "" || 
          dados.aluno4 === "" || 

          dados.artigo1 === null || 
          dados.artigo2 === null ||
          dados.artigo3 === null ||
          dados.artigo4 === null ||
          dados.artigo5 === null ||
          dados.artigo6 === null ||
          dados.artigo7 === null ||

          dados.relatorio === null || 

          dados.oral1 === null || 
          dados.oral2 === null || 
          dados.oral3 === null || 
          dados.oral4 === null) 
          
        {
          return false;
        }

        //não precisa de else pois a função se encerra em caso de false
        return true;
      }

      function calcular() 
      {
        const dados = pegarDados();

        //se dados === false
        if (!validarDados(dados)) 
        {
          document.getElementById("mensagem").innerText = "Preencha todos os campos corretamente";

          return;
        }
        
        //se dados === true então calcula as notas finais
        //peso das notas
        const pesoArtigo = 0.3;
        const pesoRelatorio = 0.3;
        const pesoOral = 0.4;

        //soma das notas
        const totalArtigo = dados.artigo1 + dados.artigo2 + dados.artigo3 
        + dados.artigo4 + dados.artigo5 + dados.artigo6 + dados.artigo7;

        //notas finais - soma das notas com seus respectivos pesos
        const final1 = (totalArtigo * pesoArtigo) + (dados.relatorio * pesoRelatorio) + (dados.oral1 * pesoOral);
        const final2 = (totalArtigo * pesoArtigo) + (dados.relatorio * pesoRelatorio) + (dados.oral2 * pesoOral);
        const final3 = (totalArtigo * pesoArtigo) + (dados.relatorio * pesoRelatorio) + (dados.oral3 * pesoOral);
        const final4 = (totalArtigo * pesoArtigo) + (dados.relatorio * pesoRelatorio) + (dados.oral4 * pesoOral);
 
        //exibe os resultados nos parágrafos de mensagem - .toFixed(2) fixa máximo de 2 casas decimais - .replace troca ponto por virgula
        document.getElementById("resultado1").innerText = dados.aluno1 + ": " + final1.toFixed(2).replace('.', ',');
        document.getElementById("resultado2").innerText = dados.aluno2 + ": " + final2.toFixed(2).replace('.', ',');
        document.getElementById("resultado3").innerText = dados.aluno3 + ": " + final3.toFixed(2).replace('.', ',');
        document.getElementById("resultado4").innerText = dados.aluno4 + ": " + final4.toFixed(2).replace('.', ',');

        //esconde a mensagem
        document.getElementById("mensagem").innerText = "";

      }

      function salvarAvaliacao() 
      {
        const dados = pegarDados();

        if (!validarDados(dados))
        {
          document.getElementById("mensagem").innerText = "Preencha todos os campos corretamente.";

          return;
        }

        document.getElementById("mensagem").innerText = "Salvando avaliação..."

        google.script.run
          .withSuccessHandler(function(resultado) 
          {
            document.getElementById("resultado1").innerText = resultado.aluno1 + ": " + resultado.final1.toFixed(2).replace('.', ',');
            document.getElementById("resultado2").innerText = resultado.aluno2 + ": " + resultado.final2.toFixed(2).replace('.', ',');
            document.getElementById("resultado3").innerText = resultado.aluno3 + ": " + resultado.final3.toFixed(2).replace('.', ',');
            document.getElementById("resultado4").innerText = resultado.aluno4 + ": " + resultado.final4.toFixed(2).replace('.', ',');

            document.getElementById("mensagem").innerText = "Avaliação salva com sucesso!";
          })

          .withFailureHandler(function(erro)
          {
            document.getElementById("mensagem").innerText = "Erro: " + erro.message;
          })
          
          .salvarAvaliacaoTeste(dados);

      }



      function atualizarNomeAluno(numeroAluno)
      {
        const campoAluno = document.getElementById("aluno" + numeroAluno);

        const nomeExibido = document.getElementById("nomeAluno" + numeroAluno);

        const nome = campoAluno.value.trim();

        if (nome === "")
        {
          nomeExibido.innerText = "";
        }

        else
        {
          nomeExibido.innerText = "(" + nome + ")"
        }
      }


 
      function salvar() 
      {

        /*recebe os dados digitados*/
        const avaliador = document.getElementById("avaliador").value;
        
        const titulo = document.getElementById("titulo").value;

        /*aplica a mensagem de retorno ao parágrafo*/
        document.getElementById("mensagem").innerText = "Salvando...";

        google.script.run
          
          //mensagem em caso de sucesso
          .withSuccessHandler(function(resposta) {
            document.getElementById("mensagem").innerText = resposta;
          })

          //mensagem em caso de fracasso
          .withFailureHandler(function(erro) {
            document.getElementById("mensagem").innerText = "Erro: " + erro;
          })

          /*salva na planilha*/
          .salvarTeste(avaliador, titulo);
      }



      function gerarArquivo() 
      {

        /*recebe os dados digitados*/
        const avaliador = document.getElementById("avaliador").value

        const titulo = document.getElementById("titulo").value

        /*aplica a mensagem de retorno ao parágrafo*/
        document.getElementById("mensagem").innerText = "Gerando arquivo...";

        google.script.run

          //mensagem em caso de sucesso
          .withSuccessHandler(function(resposta) {
            document.getElementById("mensagem").innerText = resposta;
          })
          
          //mensagem em caso de fracasso
          .withFailureHandler(function(erro) {
            document.getElementById("mensagem").innerText = "Erro: " + erro;
          })
        
          /*cria o txt de teste*/
          .criarArquivoTeste(avaliador, titulo);
      }



      function gerarDocumento() {

        /*recebe os dados digitados*/
        const avaliador = document.getElementById("avaliador").value;

        const titulo = document.getElementById("titulo").value;

        /*aplica a mensagem de retorno ao parágrafo*/
        document.getElementById("mensagem").innerText = "Gerando documento..."

        google.script.run

          //mensagem em caso de sucesso
          .withSuccessHandler(function(resposta) {
            document.getElementById("mensagem").innerText = resposta;
          })

          //mensagem em caso de fracasso
          .withFailureHandler(function(erro) {
            document.getElementById("mensagem").innerText = "Erro: " + erro;
          })

          /*edita o doc de teste*/
          .gerarDocumentoTeste(avaliador, titulo);
      }


    </script>

  </body>

</html>
