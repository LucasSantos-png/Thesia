<!DOCTYPE html>
<html>

  <head>
    <base target="_top">

    <style>
      :root
      {
        --azul: #0057A8;
        --azul-escuro: #003B73;
        --azul-hover: #004782;
        --azul-claro: #EAF4FF;
        --laranja: #f8c611;
        --laranja-hover: #e7a20c;
        --laranja-claro: #FFF1E6;
        --branco: #FAFAFA;
        --fundo: #E1E7ED;
        --texto: #1F2933;
        --texto-secundario: #667085;
        --borda: #D9DEE5;
        --sombra: 0 4px 15px rgba(0, 0, 0, 0.08);
        --raio: 10px;
      }

      *, *::before, *::after
      {
        box-sizing: border-box;
      }

      html
      {
        scroll-behavior: smooth;
      }

      body
      {
        margin: 0;
        padding: 0 0 50px;
        background-color: var(--fundo);
        color: var(--azul-escuro);
        font-family: Arial, Helvetica, sans-serif;
        font-size: 18px;
        line-height: 1.55;
        min-height: 100vh;
      }

      h1
      {
        position: relative;
        margin: 0 0 35px;
        padding: 28px 40px;
        min-height: 90px;
        background: linear-gradient(135deg, var(--azul-escuro), var(--azul));
        color: var(--branco);
        display: flex;
        align-items: center;
        font-size: 32px;
        font-weight: 700;
        letter-spacing: 0.5px;
        border-bottom: 5px solid var(--laranja);
      }

      h1::after
      {
        content: "Faculdade Engenheiro Salvador Arena";
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        font-size: 22px;
        font-weight: 600;
        white-space: nowrap;
      }

      h2
      {
        width: min(700px, 90%);
        margin: 40px auto 10px;
        padding: 12px 16px;
        background: linear-gradient(90deg, var(--azul-escuro) 0%, rgba(234, 244, 255, 0.2) 100%);
        color: var(--azul-claro);
        font-size: 23px;
        border-left: 5px solid var(--laranja);
        border-top: 1px solid rgba(0, 87, 168, 0.08);
        border-bottom: 1px solid rgba(0, 87, 168, 0.08);
      }

      label
      {
        display: block;
        width: min(700px, 90%);
        margin: 16px auto 0;
        color: var(--azul-escuro);
        font-weight: 700;
        font-size: 18px;
      }

      input[type="text"], input[type="email"], select
      {
        display: block;
        width: min(700px, 90%);
        margin: 0 auto 4px;
        padding: 13px 14px;
        background-color: var(--branco);
        color: var(--texto);
        border: 1px solid var(--borda);
        border-radius: 7px;
        font-family: inherit;
        font-size: 18px;
        outline: none;
        transition: border-color 0.2s, box-shadow 0.2s;
      }

      input[type="text"]:focus, input[type="email"]:focus, select:focus
      {
        border-color: var(--azul);
        box-shadow: 0 0 0 3px var(--azul-claro);
      }

      form
      {
        width: min(700px, 90%);
        margin: 25px auto 28px;
      }

      form p
      {
        margin: 0;
        color: var(--azul-escuro);
        font-size: 18px;
        font-weight: 700;
      }

      .curso-opcoes
      {
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 42px;
        margin: 0;
      }

      .curso-item
      {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 9px;
        width: auto !important;
        margin: 0 !important;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
      }

      .curso-item input[type="radio"]
      {
        width: 19px;
        height: 19px;
        margin: 0;
        accent-color: var(--azul);
        cursor: pointer;
      }

      .aluno-linha
      {
        display: flex;
        width: min(700px, 90%);
        margin: 18px auto;
        gap: 24px;
        align-items: flex-end;
      }

      .campo-aluno
      {
        flex: 1;
        min-width: 0;
      }

      .campo-ra
      {
        flex: 0 0 210px;
      }

      .aluno-linha label
      {
        width: auto;
        margin: 0 0 7px;
      }

      .aluno-linha input[type="text"]
      {
        width: 100%;
        margin: 0;
      }

      .campo-ra input[id^="RA"]
      {
        width: 100%;
        max-width: none;
      }

      .nota
      {
        width: 130px !important;
        margin-left: auto !important;
        margin-right: auto !important;
        text-align: center;
        font-weight: 600;
        font-size: 18px !important;
      }

      .acoes
      {
        width: min(700px, 90%);
        margin: 30px auto 10px;
        text-align: center;
      }

      .container
      {
        width: 70%;
        max-width: 1200px;
        margin: 0 auto;
      }

      button
      {
        display: inline-block;
        min-width: 230px;
        min-height: 58px;
        padding: 15px 28px;
        margin: 8px;
        background-color: var(--azul);
        color: var(--branco);
        border: none;
        border-radius: 9px;
        font-family: inherit;
        font-size: 18px;
        font-weight: 700;
        cursor: pointer;
        transition: background-color 0.2s, transform 0.1s, box-shadow 0.2s;
      }

      button:hover
      {
        background-color: var(--azul-hover);
        box-shadow: 0 5px 12px rgba(0, 87, 168, 0.25);
      }

      button:active
      {
        transform: translateY(2px);
      }

      #mensagem
      {
        width: min(700px, 90%);
        margin: 16px auto;
        padding: 12px;
        text-align: center;
        font-weight: 600;
        font-size: 18px;
      }

      #resultado1, #resultado2, #resultado3, #resultado4, #resultado5
      {
        width: min(700px, 90%);
        margin: 10px auto;
        padding: 13px 15px;
        background-color: var(--azul-claro);
        border-left: 5px solid var(--azul);
        border-radius: 6px;
        font-size: 18px;
        font-weight: 600;
      }

      /* NOTAS ORAIS EM GRADE 2x2 */
      .oral-grid
      {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        width: min(700px, 90%);
        margin: 15px auto 30px;
        gap: 18px 40px;
      }

      .oral-aluno
      {
        display: flex;
        flex-direction: column;
      }

      .oral-aluno label
      {
        width: auto;
        margin: 0 0 6px;
      }

      .oral-aluno .nota
      {
        width: 120px !important;
        margin: 0 !important;
      }

      @media (max-width: 768px)
      {
        body
        {
          font-size: 16px;
        }

        h1
        {
          min-height: 78px;
          padding: 20px;
          font-size: 27px;
        }

        h1::after
        {
          display: none;
        }

        .curso-opcoes
        {
          flex-direction: column;
          align-items: flex-start;
          gap: 12px;
        }

        .aluno-linha
        {
          flex-direction: column;
          align-items: stretch;
          gap: 12px;
        }

        .campo-ra
        {
          flex: none;
          width: 100%;
        }

        button
        {
          display: block;
          width: 100%;
          margin: 12px auto;
        }
      }

      @media (max-width: 600px)
      {
        .oral-grid
        {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>

  <body>
    <h1>Thesia</h1>

    <!--Inputs de dados-->

    <input type="text" id="orientador">

    <form action="">

      <div class="curso-opcoes">

    <!--quantidade de alunos-->

    <!--input dos nomes dos alunos participantes e seus RAs-->

        </div>

        </div>
      </div>

      <div class="aluno-linha" id="aluno-linha-2">
        <div class="campo-aluno">
          <label for="aluno2">Aluno 2:</label>
          <input type="text" id="aluno2" oninput="atualizarNomeAluno(2)">
        </div>
        <div class="campo-ra">
          <label for="RA2">RA:</label>
          <input type="text" id="RA2" inputmode="numeric" maxlength="9" class="ra">
        </div>
      </div>

      <div class="aluno-linha" id="aluno-linha-3">
        <div class="campo-aluno">
          <label for="aluno3">Aluno 3:</label>
          <input type="text" id="aluno3" oninput="atualizarNomeAluno(3)">
        </div>
        <div class="campo-ra">
          <label for="RA3">RA:</label>
          <input type="text" id="RA3" inputmode="numeric" maxlength="9" class="ra">

      </div>

      <div class="aluno-linha" id="aluno-linha-4">
        <div class="campo-aluno">
          <label for="aluno4">Aluno 4:</label>
          <input type="text" id="aluno4" oninput="atualizarNomeAluno(4)">
        </div>
        <div class="campo-ra">
          <label for="RA4">RA:</label>
          <input type="text" id="RA4" inputmode="numeric" maxlength="9" class="ra">

      <div class="aluno-linha" id="aluno-linha-5" style="display:none;">
        <div class="campo-aluno">
          <label for="aluno5">Aluno 5:</label>

        <div class="campo-ra">

    </div>

    <!--notas dos critérios de artigo científico-->
    <h2>Artigo Científico</h2>

    <label>1. Adequação do tema com as linhas de pesquisa: <b>(Máximo: 1,0)</b></label>
    <input type="text" id="artigo1" inputmode="decimal" placeholder="Ex: 0,5" class="nota">

    <!--notas dos critérios de relatório técnico-->

    <label>1. O conteúdo promove a interdisciplinaridade: <b>(Máximo: 2,0)</b></label>
    <input type="text" id="relatorio1" inputmode="decimal" placeholder="Ex: 1,5" class="nota">

    <input type="text" id="relatorio3" inputmode="decimal" placeholder="Ex: 2,5" class="nota">

    <label>4. Os alunos demonstram visão crítica e reflexiva acerca do tema: <b>(Máximo: 2,0)</b></label>

    <input type="text" id="relatorio5" inputmode="decimal" placeholder="Ex: 1,5" class="nota">

    <!--notas dos critérios de apresentação oral geradas conforme a quantidade de alunos-->
    <h2>Apresentação oral:</h2>
    <div id="avaliacao-oral-container"></div>

    <label for="email">E-mail para receber uma cópia da ficha:</label>
    <input type="email" name="email" id="email" placeholder="seuemail@dominio.com">

    <div class="acoes">
      <button type="button" onclick="calcular()">Calcular</button>
      <button type="button" onclick="salvarAvaliacao()">Salvar avaliação</button>
    </div>

    <!--para feedback de salvando/erro-->
    <p id="mensagem"></p>

    <h2>Resultados</h2>

    <!--exibe as notas calculadas antes de enviar/salvar-->
    <p id="resultado1"></p>
    <p id="resultado2"></p>
    <p id="resultado3"></p>
    <p id="resultado4"></p>
    <p id="resultado5"></p>

    <script>
      //função que converte de texto para número e verifica se o valor é válido
      function converterNota(valor, notaMaxima)
      {
        //remove espaços
        valor = valor.replace(/\s+/g,'');

        //aceita tanto 8,5 quanto 8.5
        valor = valor.replace(',','.');

        //converte texto em número
        const nota = parseFloat(valor);

        //verifica se está vazio
        if (isNaN(nota))
        {
          return null;
        }

        //verifica se é um numero invalido
        if (nota < 0 || nota > notaMaxima)
        {
          return null;
        }

        return nota;
      }


      //gera os campos de apresentação oral conforme a quantidade de alunos escolhida
      function criarCamposOral()
      {
        const quantidade = Number(document.getElementById("quantidadeAlunos").value);
        const container = document.getElementById("avaliacao-oral-container");

        //guarda temporariamente as notas que já foram digitadas
        const notasAnteriores = {};
        container.querySelectorAll(".nota").forEach(function(campo)
        {
          notasAnteriores[campo.id] = campo.value;
        });

        container.innerHTML = "";

        const criterios = [
          { numero: 1, texto: "A apresentação sistematizada do trabalho final de acordo com as normas indicadas:", maximo: 2 },
          { numero: 2, texto: "A clareza da exposição e coerência argumentativa dos alunos:", maximo: 2.5 },
          { numero: 3, texto: "O caráter científico do trabalho: a consistência dos dados e da fundamentação teórica:", maximo: 2.5 },
          { numero: 4, texto: "A participação de todos os alunos do grupo na apresentação:", maximo: 2 },
          { numero: 5, texto: "O respeito ao tempo de apresentação:", maximo: 1 }
        ];

        criterios.forEach(function(criterio)
        {
          const titulo = document.createElement("label");
          titulo.innerHTML = criterio.numero + ". " + criterio.texto + " <b>(Máximo: " + criterio.maximo.toString().replace(".", ",") + ")</b>";
          container.appendChild(titulo);

          const grid = document.createElement("div");
          grid.className = "oral-grid";

          for (let aluno = 1; aluno <= quantidade; aluno++)
          {
            const divAluno = document.createElement("div");
            divAluno.className = "oral-aluno";

            const nome = document.getElementById("aluno" + aluno).value.trim();
            const idCampo = "oral" + criterio.numero + "aluno" + aluno;
            const valorAnterior = notasAnteriores[idCampo] || "";

            divAluno.innerHTML = '<label for="' + idCampo + '">Aluno ' + aluno + ' <span class="nomeAluno' + aluno + '">' + (nome === "" ? "" : "(" + nome + ")") + '</span>:</label>' +
              '<input type="text" id="' + idCampo + '" inputmode="decimal" placeholder="Ex: ' + exemploNota(criterio.maximo) + '" class="nota" value="' + valorAnterior + '">';

            grid.appendChild(divAluno);
          }

          container.appendChild(grid);
        });

        aplicarEventosNotas();
      }


      //define o exemplo mostrado dentro de cada campo de nota oral
      function exemploNota(notaMaxima)
      {
        if (notaMaxima === 1)
        {
          return "0,5";
        }

        if (notaMaxima === 2)
        {
          return "1,5";
        }

        return "2,5";
      }


      //altera quantos alunos aparecem no formulário
      function alterarQuantidadeAlunos()
      {
        const quantidade = Number(document.getElementById("quantidadeAlunos").value);

        for (let i = 1; i <= 5; i++)
        {
          const linhaAluno = document.getElementById("aluno-linha-" + i);

          if (i <= quantidade)
          {
            linhaAluno.style.display = "flex";
          }
          else
          {
            linhaAluno.style.display = "none";
          }
        }

        criarCamposOral();

        //limpa os resultados quando a quantidade de alunos muda
        for (let i = 1; i <= 5; i++)
        {
          document.getElementById("resultado" + i).innerText = "";
        }

        document.getElementById("mensagem").innerText = "";
      }


      function filtrarNota(campo)
      {
        //remove espaços do input
        let valor = campo.value.replace(/\s+/g,"");

        //qualquer caractere que não seja numero virgula ou ponto vira vazio
        valor = valor.replace(/[^0-9,.]/g, "");

        //permite apenas um separador decimal
        let resultado = "";
        let contarSeparador = false;

        for (const caractere of valor)
        {
          if (caractere === "," || caractere === ".")
          {
            if (contarSeparador)
            {
              continue;
            }

            contarSeparador = true;
          }

          resultado += caractere;
        }

        campo.value = resultado;
      }


      //função que bloqueia caracteres invalidos em campos de nota
      function bloquearCaracterInvalido(evento)
      {
        const caractere = evento.key;
        const teclasPermitidas = ["Backspace", "Delete", "ArrowLeft", "ArrowRight", "Tab"];

        //permite comandos como Ctrl + A ou Ctrl + C
        if (evento.ctrlKey || evento.metaKey)
        {
          return;
        }

        //permite teclas de navegação e exclusão
        if (teclasPermitidas.includes(caractere))
        {
          return;
        }

        //se não for um caractere válido, bloqueia
        if (!/[0-9,.]/.test(caractere))
        {
          evento.preventDefault();
        }
      }


      //aplica os eventos nos campos de nota, inclusive nos campos orais gerados depois
      function aplicarEventosNotas()
      {
        document.querySelectorAll(".nota").forEach(function(campo)
        {
          campo.removeEventListener("keydown", bloquearCaracterInvalido);
          campo.addEventListener("keydown", bloquearCaracterInvalido);

          campo.oninput = function()
          {
            filtrarNota(campo);
          };
        });
      }


      //permite apenas números nos campos de RA
      document.querySelectorAll(".ra").forEach(function(campo)
      {
        campo.addEventListener("input", function()
        {
          campo.value = campo.value.replace(/[^0-9]/g, "").slice(0, 9);
        });
      });


      function pegarDados()
      {
        const cursoSelecionado = document.querySelector('input[name="curso"]:checked');
        const quantidadeAlunos = Number(document.getElementById("quantidadeAlunos").value);

        const dados =
        {
          orientador: document.getElementById("orientador").value.trim(),
          titulo: document.getElementById("titulo").value.trim(),
          curso: cursoSelecionado ? cursoSelecionado.value : "",
          quantidadeAlunos: quantidadeAlunos,

          //notas de artigo
          artigo1: converterNota(document.getElementById("artigo1").value, 1),
          artigo2: converterNota(document.getElementById("artigo2").value, 1),
          artigo3: converterNota(document.getElementById("artigo3").value, 2),
          artigo4: converterNota(document.getElementById("artigo4").value, 2),
          artigo5: converterNota(document.getElementById("artigo5").value, 2),
          artigo6: converterNota(document.getElementById("artigo6").value, 1),
          artigo7: converterNota(document.getElementById("artigo7").value, 1),

          //notas de relatório
          relatorio1: converterNota(document.getElementById("relatorio1").value, 2),
          relatorio2: converterNota(document.getElementById("relatorio2").value, 1),
          relatorio3: converterNota(document.getElementById("relatorio3").value, 3),
          relatorio4: converterNota(document.getElementById("relatorio4").value, 2),
          relatorio5: converterNota(document.getElementById("relatorio5").value, 2),

          email: document.getElementById("email").value.trim()
        };

        const limitesOrais = [2, 2.5, 2.5, 2, 1];

        //pega somente os alunos que existem na avaliação atual
        for (let aluno = 1; aluno <= quantidadeAlunos; aluno++)
        {
          dados["aluno" + aluno] = document.getElementById("aluno" + aluno).value.trim();
          dados["ra" + aluno] = document.getElementById("RA" + aluno).value.trim();

          for (let criterio = 1; criterio <= 5; criterio++)
          {
            const idCampo = "oral" + criterio + "aluno" + aluno;
            dados[idCampo] = converterNota(document.getElementById(idCampo).value, limitesOrais[criterio - 1]);
          }
        }

        return dados;
      }


      //verifica se existe algum campo em branco ou com nota inválida
      function validarDados(dados)
      {
        //garante que o RA tenha 9 digitos
        const raValido = /^\d{9}$/;

        //garante que o email seja valido
        const emailValido = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        if (dados.orientador === "" || dados.titulo === "" || dados.curso === "")
        {
          return { valido: false, mensagem: "Preencha o orientador, o título e o curso." };
        }

        //valida os alunos existentes
        for (let aluno = 1; aluno <= dados.quantidadeAlunos; aluno++)
        {
          if (dados["aluno" + aluno] === "")
          {
            return { valido: false, mensagem: "Preencha o nome do Aluno " + aluno + "." };
          }

          if (!raValido.test(dados["ra" + aluno]))
          {
            return { valido: false, mensagem: "O RA do Aluno " + aluno + " deve ter exatamente 9 números." };
          }
        }

        //valida notas do artigo
        for (let criterio = 1; criterio <= 7; criterio++)
        {
          if (dados["artigo" + criterio] === null)
          {
            return { valido: false, mensagem: "Preencha corretamente todas as notas do Artigo Científico." };
          }
        }

        //valida notas do relatório
        for (let criterio = 1; criterio <= 5; criterio++)
        {
          if (dados["relatorio" + criterio] === null)
          {
            return { valido: false, mensagem: "Preencha corretamente todas as notas do Relatório Técnico." };
          }
        }

        //valida notas orais apenas dos alunos existentes
        for (let aluno = 1; aluno <= dados.quantidadeAlunos; aluno++)
        {
          for (let criterio = 1; criterio <= 5; criterio++)
          {
            if (dados["oral" + criterio + "aluno" + aluno] === null)
            {
              return { valido: false, mensagem: "Preencha a nota oral do Aluno " + aluno + " no critério " + criterio + "." };
            }
          }
        }

        if (dados.email === "" || !emailValido.test(dados.email))
        {
          return { valido: false, mensagem: "Informe um e-mail válido." };
        }

        return { valido: true, mensagem: "" };
      }


      //função usada para calcular as notas finais dos alunos e exibir no html
      function calcular()
      {
        const dados = pegarDados();
        const validacao = validarDados(dados);

        if (!validacao.valido)
        {
          document.getElementById("mensagem").innerText = validacao.mensagem;
          return;
        }

        //peso das notas
        const pesoArtigo = 0.3;
        const pesoRelatorio = 0.3;
        const pesoOral = 0.4;

        //soma das notas de artigo
        const totalArtigo = dados.artigo1 + dados.artigo2 + dados.artigo3 + dados.artigo4 + dados.artigo5 + dados.artigo6 + dados.artigo7;

        //soma das notas de relatório
        const totalRelatorio = dados.relatorio1 + dados.relatorio2 + dados.relatorio3 + dados.relatorio4 + dados.relatorio5;

        //limpa todos os resultados anteriores
        for (let aluno = 1; aluno <= 5; aluno++)
        {
          document.getElementById("resultado" + aluno).innerText = "";
        }

        //calcula apenas os alunos existentes
        for (let aluno = 1; aluno <= dados.quantidadeAlunos; aluno++)
        {
          const totalOral = dados["oral1aluno" + aluno] + dados["oral2aluno" + aluno] + dados["oral3aluno" + aluno] + dados["oral4aluno" + aluno] + dados["oral5aluno" + aluno];
          const notaFinal = (totalArtigo * pesoArtigo) + (totalRelatorio * pesoRelatorio) + (totalOral * pesoOral);

          document.getElementById("resultado" + aluno).innerText = dados["aluno" + aluno] + ": " + notaFinal.toFixed(2).replace('.', ',');
        }

        document.getElementById("mensagem").innerText = "";
      }


      //função que envia os dados da avaliação para salvar na planilha
      function salvarAvaliacao()
      {
        const dados = pegarDados();
        const validacao = validarDados(dados);

        if (!validacao.valido)
        {
          document.getElementById("mensagem").innerText = validacao.mensagem;

          for (let aluno = 1; aluno <= 5; aluno++)
          {
            document.getElementById("resultado" + aluno).innerText = "";
          }

          return;
        }

        document.getElementById("mensagem").innerText = "Salvando avaliação...";

        google.script.run
          .withSuccessHandler(function(resultado)
          {
            //limpa resultados anteriores
            for (let aluno = 1; aluno <= 5; aluno++)
            {
              document.getElementById("resultado" + aluno).innerText = "";
            }

            //o Code.gs será adaptado para devolver quantidadeAlunos e os resultados dinamicamente
            const quantidadeResultado = resultado.quantidadeAlunos || dados.quantidadeAlunos;

            for (let aluno = 1; aluno <= quantidadeResultado; aluno++)
            {
              const nomeAluno = resultado["aluno" + aluno] || dados["aluno" + aluno];
              const notaFinal = resultado["final" + aluno];

              if (notaFinal !== undefined && notaFinal !== null)
              {
                document.getElementById("resultado" + aluno).innerText = nomeAluno + ": " + Number(notaFinal).toFixed(2).replace('.', ',');
              }
            }

            document.getElementById("mensagem").innerText = "Avaliação salva com sucesso!";
          })
          .withFailureHandler(function(erro)
          {
            document.getElementById("mensagem").innerText = "Erro: " + erro.message;
          })
          .salvarAvaliacao(dados);
      }


      //função que exibe nome do aluno nas notas orais conforme é digitado
      function atualizarNomeAluno(numeroAluno)
      {
        const campoAluno = document.getElementById("aluno" + numeroAluno);
        const nome = campoAluno.value.trim();
        const nomesExibidos = document.querySelectorAll(".nomeAluno" + numeroAluno);

        nomesExibidos.forEach(function(nomeExibido)
        {
          if (nome === "")
          {
            nomeExibido.innerText = "";
          }
          else
          {
            nomeExibido.innerText = "(" + nome + ")";
          }
        });
      }


      //configuração inicial da página
      window.addEventListener("load", function()
      {
        alterarQuantidadeAlunos();
        aplicarEventosNotas();

        for (let aluno = 1; aluno <= 5; aluno++)
        {
          atualizarNomeAluno(aluno);
        }
      });
    </script>
