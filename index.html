    <script>
      //função que converte de texto para número e verifica se o valor é válido
      function converterNota(valor, notaMaxima) 
      {
        //remove espaços - "/\s+/g" pega os espaços e os remove (troca por '')
        valor = valor.replace(/\s+/g,'');

        //aceita tanto 8,5 quanto 8.5 - troca virgula por ponto
        valor = valor.replace(',','.');

        //converte texto em número
        const nota = parseFloat(valor);

        //verifica se está vazio
        if (isNaN(nota)) 
        {
          return null;
        }

        //verifica se é um numero invalido - < 0 ou > nota máxima
        if (nota < 0 || nota > notaMaxima) 
        {
          return null;
        }

        return nota;

      }

      
      function filtrarNota(campo) 
      {
        //remove espaços do input
        // \s significa "espaço em branco" -> + "um ou mais" -> g "todos" e troca por ""
        let valor = campo.value.replace(/\s+/g,"");

        //qualquer caractere que não seja numero virgula ou ponto vira = ""
        valor = valor.replace(/[^0-9,.]/g, "");

        //permite apenas um separador decimal (ponto ou virgula)
        let resultado = "";
        let contarSeparador = false;

        //passa por todos caracteres do input
        for (const caractere of valor)
        {
          //se o caractere for virgula ou ponto
          if (caractere === "," || caractere === ".") 
          {
            //verifica se já encontrou um separador
            if (contarSeparador) 
            {
              //se já encontrou (for true), remove o próximo separador e continua
              continue;
            }

            //ao achar o primeiro separador, permite sua exibição e vira = true
            contarSeparador = true;
          }

          //atribui cada verificação ao resultado, caractere por caractere
          resultado += caractere;
        }

        campo.value = resultado;
      }


      //função que bloqueia caracteres invalidos em campos de nota
      function bloquearCaracterInvalido(evento) 
      {
        const caractere = evento.key;

        const teclasPermitidas = ["Backspace", "Delete", "ArrowLeft", "ArrowRight", "Tab"];

        //permite comandos como Ctrl + A ou Ctrl + C nos campos de nota
        if (evento.ctrlKey || evento.metaKey)
        {
          return;
        }

        //se forem caracteres permitidos, continua
        if (teclasPermitidas.includes(caractere)) 
        {
          return;
        }

        //se não for um caractere válido, bloqueia
        if (!/[0-9,.]/.test(caractere)) 
        {
          evento.preventDefault();
        }
      }


      //aplica a função de bloqueio de caracteres em todos os campos de nota
      document.querySelectorAll(".nota").forEach(function(campo) 
      {
        //impede a aparição de caracteres invalidos - ao digitar
        campo.addEventListener("keydown", bloquearCaracterInvalido);

        //filtra o input para um formato válido - ao colar
        campo.addEventListener("input", function() 
        {
          filtrarNota(campo)
        });
      });


      function pegarDados()

          oral3aluno2: converterNota(document.getElementById("oral3aluno2").value, 2.5),

          oral4aluno2: converterNota(document.getElementById("oral4aluno2").value, 2),

          oral5aluno2: converterNota(document.getElementById("oral5aluno2").value, 1),


          //notas de oratória e dados aluno 3

          ra3: document.getElementById("RA3").value.trim(),

          oral1aluno3: converterNota(document.getElementById("oral1aluno3").value, 2),

      //verifica se existe algum campo em branco ou com nota inválida
      function validarDados(dados) 
      {
        if (
          dados.orientador === "" || 
          dados.titulo === "" || 

          dados.aluno1 === "" || 
          dados.aluno2 === "" ||

          dados.ra1 === "" ||

          dados.ra3 === "" ||
          dados.ra4 === "" ||

          dados.artigo1 === null || 
          dados.artigo2 === null ||
          dados.artigo3 === null ||
          dados.artigo4 === null ||
          dados.artigo5 === null ||
          dados.artigo6 === null ||
          dados.artigo7 === null ||

          dados.relatorio1 === null || 
          dados.relatorio2 === null || 
          dados.relatorio3 === null || 
          dados.relatorio4 === null || 
          dados.relatorio5 === null || 

          dados.oral1aluno1 === null || 
          dados.oral1aluno2 === null || 
          dados.oral1aluno3 === null || 
          dados.oral1aluno4 === null || 

          dados.oral2aluno1 === null || 
          dados.oral2aluno2 === null || 
          dados.oral2aluno3 === null || 
          dados.oral2aluno4 === null || 

          dados.oral3aluno1 === null || 
          dados.oral3aluno2 === null || 
          dados.oral3aluno3 === null || 
          dados.oral3aluno4 === null || 

          dados.oral4aluno1 === null || 
          dados.oral4aluno2 === null || 
          dados.oral4aluno3 === null || 
          dados.oral4aluno4 === null || 
         
          dados.oral5aluno1 === null ||
          dados.oral5aluno2 === null ||
          dados.oral5aluno3 === null ||
          dados.oral5aluno4 === null ) 
          
        {
          return false;
        }

        //não precisa de else pois a função se encerra em caso de false
        return true;
      }

      //função usada para calcular as notas finais dos alunos e exibir no html
      function calcular() 
      {
        const dados = pegarDados();

        //se dados === false aparece mensagem de erro
        if (!validarDados(dados)) 
        {
          document.getElementById("mensagem").innerText = "Preencha todos os campos corretamente";

          return;
        }
        
        //se dados === true então calcula as notas finais
        //peso das notas
        const pesoArtigo = 0.3;
        const pesoRelatorio = 0.3;
        const pesoOral = 0.4;

        //soma das notas de artigo
        const totalArtigo = dados.artigo1 + dados.artigo2 + dados.artigo3 
        + dados.artigo4 + dados.artigo5 + dados.artigo6 + dados.artigo7;

        //soma das notas de relatório
        const totalRelatorio = dados.relatorio1 + dados.relatorio2 + dados.relatorio3
        + dados.relatorio4 + dados.relatorio5;

        //soma das notas de oratória aluno 1
        const totalOral1 = dados.oral1aluno1 + dados.oral2aluno1 + dados.oral3aluno1
        + dados.oral4aluno1 + dados.oral5aluno1;

        //soma das notas de oratória aluno 2
        const totalOral2 = dados.oral1aluno2 + dados.oral2aluno2 + dados.oral3aluno2
        + dados.oral4aluno2 + dados.oral5aluno2;
        
        //soma das notas de oratória aluno 3
        const totalOral3 = dados.oral1aluno3 + dados.oral2aluno3 + dados.oral3aluno3
        + dados.oral4aluno3 + dados.oral5aluno3;

        //soma das notas de oratória aluno 4
        const totalOral4 = dados.oral1aluno4 + dados.oral2aluno4 + dados.oral3aluno4
        + dados.oral4aluno4 + dados.oral5aluno4;

        //notas finais - soma das notas de cada aluno com seus respectivos pesos
        const final1 = (totalArtigo * pesoArtigo) + (totalRelatorio * pesoRelatorio) + (totalOral1 * pesoOral);
        const final2 = (totalArtigo * pesoArtigo) + (totalRelatorio * pesoRelatorio) + (totalOral2 * pesoOral);
        const final3 = (totalArtigo * pesoArtigo) + (totalRelatorio * pesoRelatorio) + (totalOral3 * pesoOral);
        const final4 = (totalArtigo * pesoArtigo) + (totalRelatorio * pesoRelatorio) + (totalOral4 * pesoOral);
 
        //exibe os resultados nos parágrafos de mensagem - .toFixed(2) fixa máximo de 2 casas decimais - .replace troca ponto por virgula
        document.getElementById("resultado1").innerText = dados.aluno1 + ": " + final1.toFixed(2).replace('.', ',');
        document.getElementById("resultado2").innerText = dados.aluno2 + ": " + final2.toFixed(2).replace('.', ',');
        document.getElementById("resultado3").innerText = dados.aluno3 + ": " + final3.toFixed(2).replace('.', ',');
        document.getElementById("resultado4").innerText = dados.aluno4 + ": " + final4.toFixed(2).replace('.', ',');

        //esconde a mensagem de salvando / falha / sucesso
        document.getElementById("mensagem").innerText = "";

      }

      //função que envia os dados da avaliação para salvar na planilha
      function salvarAvaliacao() 
      {
        const dados = pegarDados();

        //se houver campos inválidos, não prossegue o salvamento
        if (!validarDados(dados))
        {
          document.getElementById("mensagem").innerText = "Preencha todos os campos corretamente.";

          document.getElementById("resultado1").innerText = "";
          document.getElementById("resultado2").innerText = "";
          document.getElementById("resultado3").innerText = "";
          document.getElementById("resultado4").innerText = "";

          return;
        }

        //se estiver tudo certo = segue o salvamento
        document.getElementById("mensagem").innerText = "Salvando avaliação..."

        google.script.run
          .withSuccessHandler(function(resultado) 
          {
            //exibe as notas de cada aluno nos parágrafos de resultados
            document.getElementById("resultado1").innerText = resultado.aluno1 + ": " + resultado.final1.toFixed(2).replace('.', ',');
            document.getElementById("resultado2").innerText = resultado.aluno2 + ": " + resultado.final2.toFixed(2).replace('.', ',');
            document.getElementById("resultado3").innerText = resultado.aluno3 + ": " + resultado.final3.toFixed(2).replace('.', ',');
            document.getElementById("resultado4").innerText = resultado.aluno4 + ": " + resultado.final4.toFixed(2).replace('.', ',');

            //feedback visual de sucesso
            document.getElementById("mensagem").innerText = "Avaliação salva com sucesso!";
          })

          .withFailureHandler(function(erro)
          {
            //feedback visual de erro
            document.getElementById("mensagem").innerText = "Erro: " + erro.message;
          })
          
          //envia os dados pra função de salvamento
          .salvarAvaliacao(dados);

      }


      //função que exibe nome do aluno no <span> conforme é digitado
      function atualizarNomeAluno(numeroAluno)

        //pega o campo em que o nome foi digitado
        const campoAluno = document.getElementById("aluno" + numeroAluno);

        //agora busca pela classe de nomes ao invés de IDs, o "." antes de nomeAluno significa isso - classe
        const nomesExibidos = document.querySelectorAll(".nomeAluno" + numeroAluno);

        //remove os espaços antes / depois do nome
        const nome = campoAluno.value.trim();

        //função que atualiza TODAS as classes de mesmo nome
        nomesExibidos.forEach(function(nomeExibido) 
        {
          if (nome === "")
            {
              nomeExibido.innerText = "";
            }

            else
            {
              nomeExibido.innerText = "(" + nome + ")"
            }
        });

      }

    </script>

  </body>

</html>
